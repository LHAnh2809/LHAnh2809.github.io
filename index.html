<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Cá Nhân</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body id="body-container"
  class="min-h-screen flex flex-col items-center justify-start p-4 font-sans transition duration-500">

  <div class="w-full max-w-md text-center mt-12 flex flex-col items-center">
    <!-- Avatar -->
    <div class="relative group mb-4">
      <div class="absolute -inset-0.5 bg-gradient-to-r from-pink-500 to-indigo-500 rounded-full blur opacity-75"></div>
      <img id="avatar"
        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=256&auto=format&fit=crop"
        class="relative w-28 h-28 rounded-full object-cover border-2 border-white/20 shadow-xl" alt="Avatar">
    </div>

    <!-- Thông tin cá nhân -->
    <h1 id="bio-name" class="text-2xl font-extrabold tracking-wide">...</h1>
    <p id="bio-desc" class="text-sm mt-1 mb-4 max-w-xs font-light opacity-80 leading-relaxed"></p>

    <!-- Social Icons -->
    <div id="socials-container" class="flex items-center justify-center gap-3 mb-8 empty:hidden"></div>

    <!-- Danh sách Sections theo layout và theme -->
    <div id="links-container" class="w-full space-y-6"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCXvqlnqB9u0QoZAX6rmFBngHRmAlnjWYs",
      authDomain: "shops-976ea.firebaseapp.com",
      projectId: "shops-976ea",
      storageBucket: "shops-976ea.firebasestorage.app",
      messagingSenderId: "880320435925",
      appId: "1:880320435925:web:df55e51bc74d45c75ff45c",
      measurementId: "G-TVQR4E2F9K"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "bio", "profile");

    const THEMES = {
      // 1. Cực quang huyền bí (Aurora Glow)
      aurora: {
        id: 'aurora',
        name: 'Aurora',
        previewBg: 'bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-teal-400 via-indigo-900 to-slate-950',
        bodyBg: 'bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-teal-400 via-indigo-900 to-slate-950 text-emerald-100',
        textColor: 'text-emerald-100',
        groupHeader: 'text-teal-300 font-semibold tracking-wider drop-shadow',
        linkCard: 'bg-emerald-950/30 backdrop-blur-xl border border-teal-400/30 hover:border-teal-300 hover:bg-emerald-900/40 shadow-[0_8px_30px_rgb(0,0,0,0.3)] transition duration-300',
        cardText: 'text-teal-50 font-medium'
      },

      // 2. Hoàng hôn thơ mộng (Sunset Aura)
      sunset: {
        id: 'sunset',
        name: 'Sunset Aura',
        previewBg: 'bg-gradient-to-tr from-amber-500 via-rose-600 to-indigo-900',
        bodyBg: 'bg-gradient-to-tr from-amber-500 via-rose-600 to-indigo-900 text-white',
        textColor: 'text-white',
        groupHeader: 'text-amber-200 font-bold tracking-widest drop-shadow-sm',
        linkCard: 'bg-white/15 backdrop-blur-lg border border-white/30 hover:bg-white/25 shadow-lg shadow-rose-950/20 transition duration-300',
        cardText: 'text-white font-semibold'
      },

      // 3. Kính tối thượng hạng (Obsidian Glass)
      obsidian: {
        id: 'obsidian',
        name: 'Obsidian',
        previewBg: 'bg-[#0b0f19]',
        bodyBg: 'bg-[#0b0f19] text-neutral-200',
        textColor: 'text-neutral-200',
        groupHeader: 'text-neutral-400 font-bold uppercase tracking-widest',
        linkCard: 'bg-neutral-900/70 backdrop-blur-md border border-neutral-800 hover:border-neutral-600 hover:bg-neutral-800/80 shadow-2xl transition duration-300',
        cardText: 'text-neutral-100 font-medium'
      },

      // 4. Cyberpunk Neon tương lai
      cyberpunk: {
        id: 'cyberpunk',
        name: 'Cyberpunk',
        previewBg: 'bg-[#090014]',
        bodyBg: 'bg-[#090014] text-cyan-300',
        textColor: 'text-cyan-300',
        groupHeader: 'text-fuchsia-400 font-black tracking-widest drop-shadow-[0_0_8px_rgba(232,121,249,0.8)]',
        linkCard: 'bg-black/60 backdrop-blur-md border-2 border-cyan-400/80 hover:border-fuchsia-400 hover:shadow-[0_0_20px_rgba(34,211,238,0.6)] shadow-[0_0_10px_rgba(34,211,238,0.3)] transition duration-300',
        cardText: 'text-cyan-200 font-bold tracking-wide'
      },

      // 5. Trà xanh đất nung tối giản (Matcha Clay)
      matcha: {
        id: 'matcha',
        name: 'Matcha Clay',
        previewBg: 'bg-gradient-to-b from-[#e8ece5] to-[#d3decb]',
        bodyBg: 'bg-gradient-to-b from-[#e8ece5] to-[#d3decb] text-[#2c3e2d]',
        textColor: 'text-[#2c3e2d]',
        groupHeader: 'text-[#3e563f] font-bold tracking-wide',
        linkCard: 'bg-white/80 backdrop-blur border border-[#b8c9b0] text-[#2c3e2d] hover:bg-white shadow-sm hover:shadow-md transition duration-300',
        cardText: 'text-[#2c3e2d] font-semibold'
      },

      // 6. Mây tím pastel ngọt ngào (Lilac Dream)
      lilac: {
        id: 'lilac',
        name: 'Lilac Dream',
        previewBg: 'bg-gradient-to-br from-indigo-200 via-purple-100 to-pink-200',
        bodyBg: 'bg-gradient-to-br from-indigo-200 via-purple-100 to-pink-200 text-indigo-950',
        textColor: 'text-indigo-950',
        groupHeader: 'text-purple-800 font-bold',
        linkCard: 'bg-white/70 backdrop-blur-md border border-purple-200/60 text-indigo-950 hover:bg-white shadow-[0_4px_20px_rgba(168,85,247,0.1)] transition duration-300',
        cardText: 'text-indigo-950 font-semibold'
      },

      // 7. Đại dương sâu thẳm (Deep Ocean)
      ocean: {
        id: 'ocean',
        name: 'Deep Ocean',
        previewBg: 'bg-gradient-to-b from-blue-950 via-slate-900 to-black',
        bodyBg: 'bg-gradient-to-b from-blue-950 via-slate-900 to-black text-sky-200',
        textColor: 'text-sky-200',
        groupHeader: 'text-sky-400 font-semibold tracking-wider',
        linkCard: 'bg-blue-900/20 backdrop-blur-xl border border-sky-400/20 hover:border-sky-400/60 hover:bg-blue-900/40 shadow-lg transition duration-300',
        cardText: 'text-sky-100 font-medium'
      },

      // 8. Đen trắng Neo-Brutalism phá cách
      neo: {
        id: 'neo',
        name: 'Neo Brutal',
        previewBg: 'bg-[#fffdf0]',
        bodyBg: 'bg-[#fffdf0] text-black',
        textColor: 'text-black',
        groupHeader: 'text-black font-black uppercase tracking-wider',
        linkCard: 'bg-white text-black border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all font-black',
        cardText: 'text-black font-black'
      }
    };

    window.handleLinkClick = (event, itemId, url) => {
      event.preventDefault();
      window.open(url, '_blank');

      (async () => {
        try {
          const snap = await getDoc(docRef);
          if (!snap.exists()) return;
          const freshData = snap.data();

          if (freshData.sections) {
            freshData.sections.forEach(sec => {
              if (sec.type === 'group' && sec.items) {
                const target = sec.items.find(i => String(i.id) === String(itemId));
                if (target) target.clicks = (parseInt(target.clicks) || 0) + 1;
              } else if (sec.type === 'link' && sec.item && String(sec.item.id) === String(itemId)) {
                sec.item.clicks = (parseInt(sec.item.clicks) || 0) + 1;
              }
            });
            await setDoc(docRef, freshData);
          }
        } catch (err) {
          console.error("Lỗi cập nhật click:", err);
        }
      })();
    };

    async function loadBio() {
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const currentData = docSnap.data();
        const themeId = currentData.theme || 'air';
        const theme = THEMES[themeId] || THEMES.air;

        document.getElementById('body-container').className = `min-h-screen flex flex-col items-center justify-start p-4 font-sans transition duration-500 ${theme.bodyBg}`;
        document.getElementById('bio-name').innerText = currentData.name || "🍀LHAnh🍀";
        document.getElementById('bio-desc').innerText = currentData.desc || "";
        if (currentData.avatar) {
          document.getElementById('avatar').src = currentData.avatar;
        }

        // Render Social Icons
        const socialsContainer = document.getElementById('socials-container');
        socialsContainer.innerHTML = '';
        const s = currentData.socials || {};
        if (s.instagram) socialsContainer.innerHTML += `<a href="${s.instagram.startsWith('http') ? s.instagram : 'https://instagram.com/' + s.instagram}" target="_blank" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center shadow hover:scale-110 transition"><i class="fa-brands fa-instagram text-sm"></i></a>`;
        if (s.tiktok) socialsContainer.innerHTML += `<a href="${s.tiktok.startsWith('http') ? s.tiktok : 'https://tiktok.com/@' + s.tiktok}" target="_blank" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center shadow hover:scale-110 transition"><i class="fa-brands fa-tiktok text-sm"></i></a>`;
        if (s.youtube) socialsContainer.innerHTML += `<a href="${s.youtube.startsWith('http') ? s.youtube : 'https://youtube.com/' + s.youtube}" target="_blank" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center shadow hover:scale-110 transition"><i class="fa-brands fa-youtube text-sm"></i></a>`;
        if (s.email) socialsContainer.innerHTML += `<a href="mailto:${s.email}" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center shadow hover:scale-110 transition"><i class="fa-regular fa-envelope text-sm"></i></a>`;

        // Render Sections theo Layout & Theme
        const container = document.getElementById('links-container');
        container.innerHTML = '';

        const sections = currentData.sections || [];

        sections.forEach(sec => {
          if (sec.type === 'group' && sec.active !== false) {
            const activeItems = (sec.items || []).filter(item => item.active !== false);
            if (activeItems.length === 0) return; // Mặc định ẩn nhóm nếu không có link

            const layout = sec.layout || 'stack';
            let bodyHtml = '';

            if (layout === 'grid') {
              bodyHtml = `
                <div class="grid grid-cols-2 gap-3">
                  ${activeItems.map(item => `
                    <a href="${item.url}" onclick="handleLinkClick(event, '${item.id}', '${item.url}')" class="p-4 rounded-2xl flex items-center justify-center text-center font-semibold text-xs transition transform hover:-translate-y-0.5 ${theme.linkCard}">
                      <span class="truncate ${theme.cardText}">${item.title}</span>
                    </a>
                  `).join('')}
                </div>
              `;
            } else if (layout === 'carousel') {
              bodyHtml = `
                <div class="flex gap-3 overflow-x-auto no-scrollbar py-1">
                  ${activeItems.map(item => `
                    <a href="${item.url}" onclick="handleLinkClick(event, '${item.id}', '${item.url}')" class="flex-shrink-0 w-44 p-4 rounded-2xl text-center font-semibold text-xs transition transform hover:-translate-y-0.5 truncate ${theme.linkCard}">
                      <span class="truncate ${theme.cardText}">${item.title}</span>
                    </a>
                  `).join('')}
                </div>
              `;
            } else if (layout === 'showcase') {
              bodyHtml = `
                <div class="space-y-3">
                  ${activeItems.map(item => `
                    <a href="${item.url}" onclick="handleLinkClick(event, '${item.id}', '${item.url}')" class="block p-5 rounded-2xl transition transform hover:-translate-y-0.5 text-left ${theme.linkCard}">
                      <div class="flex items-center justify-between">
                        <span class="font-bold text-sm ${theme.cardText}">${item.title}</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-75"></i>
                      </div>
                      <p class="text-[11px] opacity-75 mt-1 truncate">${item.url}</p>
                    </a>
                  `).join('')}
                </div>
              `;
            } else {
              // Stack mặc định
              bodyHtml = `
                <div class="space-y-2.5">
                  ${activeItems.map(item => `
                    <a href="${item.url}" onclick="handleLinkClick(event, '${item.id}', '${item.url}')" class="block w-full py-4 px-5 rounded-2xl font-semibold text-sm text-center transition transform hover:-translate-y-0.5 ${theme.linkCard}">
                      <span class="${theme.cardText}">${item.title}</span>
                    </a>
                  `).join('')}
                </div>
              `;
            }

            container.innerHTML += `
              <div class="w-full space-y-3 pt-2">
                <h3 class="text-xs font-bold uppercase tracking-wider text-center ${theme.groupHeader}">${sec.title}</h3>
                ${bodyHtml}
              </div>
            `;
          } else if (sec.type === 'link' && sec.item && sec.item.active !== false) {
            container.innerHTML += `
              <a href="${sec.item.url}" onclick="handleLinkClick(event, '${sec.item.id}', '${sec.item.url}')" class="block w-full py-4 px-5 rounded-2xl font-semibold text-sm text-center transition transform hover:-translate-y-0.5 ${theme.linkCard}">
                <span class="${theme.cardText}">${sec.item.title}</span>
              </a>
            `;
          }
        });
      }
    }

    loadBio();
  </script>
</body>

</html>
