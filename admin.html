<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio Dashboard - Theme & Links</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><rect width='32' height='32' rx='16' fill='%23111827'/><path d='M16 6v20M16 11l-5 5M16 16l6 5M16 20l-4 4' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sortable-ghost { opacity: 0.25; background: #e0e7ff !important; border: 2px dashed #6366f1 !important; border-radius: 16px; }
        .drag-handle-root, .drag-handle-item { cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
        .drag-handle-root:active, .drag-handle-item:active { cursor: grabbing; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .nested-dropzone { min-height: 48px !important; }
        .empty-hint { pointer-events: none !important; user-select: none !important; }

        /* Vùng đệm ẩn theo mặc định */
        .orphan-slot {
            max-height: 0px !important;
            min-height: 0px !important;
            opacity: 0;
            overflow: hidden;
            padding: 0 !important;
            margin: 0 !important;
            border: 2px dashed transparent !important;
            transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease, margin 0.25s ease;
        }

        /* Khi đang nhấc link: Nở khung và hiện viền tím */
        body.is-dragging-link .orphan-slot {
            max-height: 70px !important;
            min-height: 52px !important;
            opacity: 1;
            padding: 12px !important;
            margin: 10px 0 !important;
            border-color: #c084fc !important;
            background-color: rgba(243, 232, 255, 0.5) !important;
        }
    </style>
</head>

<body class="bg-[#f6f7f9] font-sans h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- TOPNAV -->
    <header class="h-14 bg-white border-b border-gray-200 px-4 md:px-6 flex justify-between items-center flex-shrink-0 z-20 relative">
        <div class="flex items-center gap-3">
            <button onclick="toggleMobileDrawer()" class="md:hidden w-9 h-9 rounded-xl hover:bg-gray-100 flex items-center justify-center text-gray-700 text-lg transition focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>
            <i class="fa-brands fa-pagelines text-2xl text-emerald-600"></i>
            <span class="font-bold text-sm tracking-tight">Bio Dashboard</span>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-xs bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full font-semibold">
                <i class="fa-solid fa-bolt mr-1"></i> Pro Plan
            </div>
            <button onclick="handleLogout()" id="btn-logout" class="hidden text-xs text-red-500 font-medium hover:underline">Đăng xuất</button>
        </div>
    </header>

    <!-- OVERLAY NỀN MỜ CHO DRAWER -->
    <div id="drawer-overlay" onclick="toggleMobileDrawer()" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-40 hidden transition-opacity"></div>

    <!-- BẢNG DRAWER MOBILE -->
    <div id="mobile-drawer" class="fixed top-0 bottom-0 left-0 w-64 bg-white z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col justify-between p-5 md:hidden">
        <div class="space-y-6">
            <div class="flex items-center justify-between pb-3 border-b border-gray-100">
                <div class="flex items-center gap-2">
                    <i class="fa-brands fa-pagelines text-xl text-emerald-600"></i>
                    <span class="font-bold text-sm">Menu Quản Lý</span>
                </div>
                <button onclick="toggleMobileDrawer()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <nav class="space-y-2">
                <button onclick="switchTab('links'); toggleMobileDrawer();" id="drawer-btn-links" class="w-full flex items-center gap-3 px-3 py-3 rounded-xl bg-purple-50 text-purple-700 font-bold text-sm transition">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->

            <h2 class="text-xl font-bold mb-1">Đăng nhập Admin</h2>
            <p class="text-xs text-gray-400 mb-6">Quản lý giao diện Bio của bạn</p>

    <!-- KHỐI QUẢN LÝ -->

                <nav class="space-y-1">

        <!-- PANEL NỘI DUNG CHÍNH -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-xl mx-auto space-y-6">

                <!-- 1. TAB LINKS -->
                <div id="view-links" class="space-y-6">
                    <!-- PROFILE HEADER -->
                    <div class="flex items-center gap-4 px-2 py-3 bg-white rounded-3xl p-4 border border-gray-200/70 shadow-sm">

                            <input type="text" id="main-profile-desc" onchange="updateProfileDesc(this.value)" placeholder="Thêm mô tả ngắn..." value="" class="text-xs text-gray-400 font-medium border-b border-transparent hover:border-gray-300 focus:border-black focus:outline-none bg-transparent w-full placeholder-gray-400 truncate">

                            <!-- Social Icons -->

                                <div class="relative group cursor-pointer" onclick="editSocial('tiktok')">
                                    <div class="w-6 h-6 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-600 hover:text-black shadow-sm text-[10px]"><i class="fa-brands fa-tiktok"></i></div>
                                </div>
                                <div class="relative group cursor-pointer" onclick="editSocial('youtube')">
                                    <div class="w-6 h-6 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-600 hover:text-red-600 shadow-sm text-[10px]"><i class="fa-brands fa-youtube"></i></div>
                                </div>
                                <div class="relative group cursor-pointer" onclick="editSocial('email')">
                                    <div class="w-6 h-6 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-600 hover:text-indigo-600 shadow-sm text-[10px]"><i class="fa-regular fa-envelope"></i></div>
                                </div>
                                <button onclick="editSocial('custom')" class="w-6 h-6 rounded-full bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-gray-600 text-[10px] shadow-sm transition"><i class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                    </div>

                    <!-- Nút thao tác -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="toggleAddForm('link')" class="bg-black hover:bg-neutral-800 text-white font-semibold py-3 px-3 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-xs">
                            <i class="fa-solid fa-plus"></i> Thêm Link Ngoài
                        </button>
                        <button onclick="toggleAddForm('group')" class="bg-white border border-gray-300 hover:bg-gray-50 text-neutral-800 font-semibold py-3 px-3 rounded-2xl shadow-sm transition flex items-center justify-center gap-2 text-xs">
                            <i class="fa-solid fa-layer-group"></i> Thêm Nhóm (Layout)
                        </button>
                    </div>

                    <!-- Form thêm mới -->
                    <div id="add-form" class="bg-white p-5 rounded-3xl border border-gray-200 shadow-sm space-y-3 hidden">
                        <h4 id="form-type-title" class="font-bold text-xs text-gray-500 uppercase tracking-wider">Thêm mới</h4>
                        <div id="form-fields" class="space-y-3"></div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="submitNewItem()" class="flex-1 bg-black hover:bg-neutral-800 text-white py-2.5 rounded-xl text-xs font-bold">Xác nhận</button>

                        </div>
                    </div>

                    <!-- Danh sách mục Linktree -->

                </div>

                <!-- 2. TAB DESIGN -->
                <div id="view-design" class="space-y-6 hidden">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-extrabold text-neutral-900 tracking-tight">Themes</h2>
                            <p class="text-xs text-gray-500 mt-0.5">Chọn phong cách và màu sắc cho trang Bio của bạn</p>
                        </div>
                        <span class="text-xs font-semibold px-3 py-1 bg-purple-100 text-purple-700 rounded-full">8 Themes</span>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4" id="themes-grid"></div>
                </div>

            </div>
        </main>

        <!-- RIGHT MOBILE PREVIEW (CHO DESKTOP) -->
        <aside class="w-[380px] bg-white border-l border-gray-200 flex flex-col items-center justify-center p-6 hidden lg:flex flex-shrink-0">
            <div class="w-[280px] h-[580px] bg-slate-900 rounded-[44px] p-3 shadow-2xl border-4 border-slate-800 relative flex flex-col">
                <div class="w-24 h-4 bg-slate-800 rounded-b-xl mx-auto absolute top-3 left-1/2 -translate-x-1/2 z-20"></div>

                <div id="phone-preview-screen" class="w-full h-full rounded-[34px] overflow-y-auto p-4 flex flex-col items-center pt-8 relative no-scrollbar transition duration-300">
                    <img id="preview-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=128&auto=format&fit=crop" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-md mb-2">
                    <h3 id="preview-name" class="font-bold text-sm text-center">🍀LHAnh🍀</h3>
                    <p id="preview-desc" class="text-[10px] opacity-75 text-center mb-2"></p>

                    <div id="preview-socials" class="flex items-center justify-center gap-2 mb-4 empty:hidden"></div>
                    <div id="preview-sections" class="w-full space-y-4"></div>
                </div>
            </div>
        </aside>

    </div>

    <!-- JAVASCRIPT & FIREBASE ENGINE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXvqlnqB9u0QoZAX6rmFBngHRmAlnjWYs",
            authDomain: "shops-976ea.firebaseapp.com",
            projectId: "shops-976ea",
            storageBucket: "shops-976ea.firebasestorage.app",
            messagingSenderId: "880320435925",
            appId: "1:880320435925:web:df55e51bc74d45c75ff45c",
            measurementId: "G-TVQR4E2F9K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const docRef = doc(db, "bio", "profile");

        // 8 THEMES HIỆN ĐẠI
        const THEMES = {
            aurora: {
                id: 'aurora',
                name: 'Aurora',
                previewBg: 'bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-teal-400 via-indigo-900 to-slate-950',
                bodyBg: 'bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-teal-400 via-indigo-900 to-slate-950 text-emerald-100',
                textColor: 'text-emerald-100',
                groupHeader: 'text-teal-300 font-semibold tracking-wider drop-shadow',
                linkCard: 'bg-emerald-950/30 backdrop-blur-xl border border-teal-400/30 hover:border-teal-300 hover:bg-emerald-900/40 shadow-lg',
                cardText: 'text-teal-50 font-medium'
            },
            sunset: {
                id: 'sunset',
                name: 'Sunset Aura',
                previewBg: 'bg-gradient-to-tr from-amber-500 via-rose-600 to-indigo-900',
                bodyBg: 'bg-gradient-to-tr from-amber-500 via-rose-600 to-indigo-900 text-white',
                textColor: 'text-white',
                groupHeader: 'text-amber-200 font-bold tracking-widest drop-shadow-sm',
                linkCard: 'bg-white/15 backdrop-blur-lg border border-white/30 hover:bg-white/25 shadow-lg',
                cardText: 'text-white font-semibold'
            },
            obsidian: {
                id: 'obsidian',
                name: 'Obsidian',
                previewBg: 'bg-[#0b0f19]',
                bodyBg: 'bg-[#0b0f19] text-neutral-200',
                textColor: 'text-neutral-200',
                groupHeader: 'text-neutral-400 font-bold uppercase tracking-widest',
                linkCard: 'bg-neutral-900/70 backdrop-blur-md border border-neutral-800 hover:border-neutral-600 hover:bg-neutral-800/80 shadow-2xl',
                cardText: 'text-neutral-100 font-medium'
            },
            cyberpunk: {
                id: 'cyberpunk',
                name: 'Cyberpunk',
                previewBg: 'bg-[#090014]',
                bodyBg: 'bg-[#090014] text-cyan-300',
                textColor: 'text-cyan-300',
                groupHeader: 'text-fuchsia-400 font-black tracking-widest drop-shadow-[0_0_8px_rgba(232,121,249,0.8)]',
                linkCard: 'bg-black/60 backdrop-blur-md border-2 border-cyan-400/80 hover:border-fuchsia-400 hover:shadow-[0_0_20px_rgba(34,211,238,0.6)] shadow-[0_0_10px_rgba(34,211,238,0.3)]',
                cardText: 'text-cyan-200 font-bold tracking-wide'
            },
            matcha: {
                id: 'matcha',
                name: 'Matcha Clay',
                previewBg: 'bg-gradient-to-b from-[#e8ece5] to-[#d3decb]',
                bodyBg: 'bg-gradient-to-b from-[#e8ece5] to-[#d3decb] text-[#2c3e2d]',
                textColor: 'text-[#2c3e2d]',
                groupHeader: 'text-[#3e563f] font-bold tracking-wide',
                linkCard: 'bg-white/80 backdrop-blur border border-[#b8c9b0] text-[#2c3e2d] hover:bg-white shadow-sm',
                cardText: 'text-[#2c3e2d] font-semibold'
            },
            lilac: {
                id: 'lilac',
                name: 'Lilac Dream',
                previewBg: 'bg-gradient-to-br from-indigo-200 via-purple-100 to-pink-200',
                bodyBg: 'bg-gradient-to-br from-indigo-200 via-purple-100 to-pink-200 text-indigo-950',
                textColor: 'text-indigo-950',
                groupHeader: 'text-purple-800 font-bold',
                linkCard: 'bg-white/70 backdrop-blur-md border border-purple-200/60 text-indigo-950 hover:bg-white shadow-md',
                cardText: 'text-indigo-950 font-semibold'
            },
            ocean: {
                id: 'ocean',
                name: 'Deep Ocean',
                previewBg: 'bg-gradient-to-b from-blue-950 via-slate-900 to-black',
                bodyBg: 'bg-gradient-to-b from-blue-950 via-slate-900 to-black text-sky-200',
                textColor: 'text-sky-200',
                groupHeader: 'text-sky-400 font-semibold tracking-wider',
                linkCard: 'bg-blue-900/20 backdrop-blur-xl border border-sky-400/20 hover:border-sky-400/60 hover:bg-blue-900/40 shadow-lg',
                cardText: 'text-sky-100 font-medium'
            },
            neo: {
                id: 'neo',
                name: 'Neo Brutal',
                previewBg: 'bg-[#fffdf0]',
                bodyBg: 'bg-[#fffdf0] text-black',
                textColor: 'text-black',
                groupHeader: 'text-black font-black uppercase tracking-wider',
                linkCard: 'bg-white text-black border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-0.5 hover:translate-y-0.5 font-black',
                cardText: 'text-black font-black'
            }
        };

        let profileData = {};
        let sections = [];
        let currentThemeId = 'aurora';
        let openedLayoutPanels = new Set();
        let openedGroupAddForms = new Set();
        let rootSortable = null;
        let nestedSortables = [];
        let currentAddType = 'link';

        const LAYOUT_DESCRIPTIONS = {
            stack: 'Hiển thị liên kết theo dạng danh sách xếp chồng dọc.',
            grid: 'Hiển thị liên kết chia thành 2 cột đều nhau.',
            carousel: 'Hiển thị thanh trượt ngang có thể vuốt.',
            showcase: 'Thẻ liên kết kích thước lớn nổi bật có hiển thị URL.'
        };

        window.toggleMobileDrawer = () => {
            const drawer = document.getElementById('mobile-drawer');
            const overlay = document.getElementById('drawer-overlay');
            if (!drawer || !overlay) return;

            const isOpen = !drawer.classList.contains('-translate-x-full');
            if (isOpen) {
                drawer.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                drawer.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('btn-logout').classList.add('hidden');
            }
        });

        window.handleLogin = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                alert("Email hoặc Mật khẩu không chính xác!");
            }
        };

        window.handleLogout = () => signOut(auth);

        window.switchTab = (tab) => {
            const btnLinks = document.getElementById('tab-btn-links');
            const btnDesign = document.getElementById('tab-btn-design');
            const drawerBtnLinks = document.getElementById('drawer-btn-links');
            const drawerBtnDesign = document.getElementById('drawer-btn-design');
            const viewLinks = document.getElementById('view-links');
            const viewDesign = document.getElementById('view-design');

            if (tab === 'links') {
                if (btnLinks) btnLinks.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-purple-50 text-purple-700 font-semibold text-xs transition";
                if (btnDesign) btnDesign.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 hover:bg-gray-50 font-medium text-xs transition";
                if (drawerBtnLinks) drawerBtnLinks.className = "w-full flex items-center gap-3 px-3 py-3 rounded-xl bg-purple-50 text-purple-700 font-bold text-sm transition";
                if (drawerBtnDesign) drawerBtnDesign.className = "w-full flex items-center gap-3 px-3 py-3 rounded-xl text-gray-600 hover:bg-gray-50 font-semibold text-sm transition";

                viewDesign.classList.add('hidden');

                if (btnDesign) btnDesign.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-purple-50 text-purple-700 font-semibold text-xs transition";
                if (btnLinks) btnLinks.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 hover:bg-gray-50 font-medium text-xs transition";
                if (drawerBtnDesign) drawerBtnDesign.className = "w-full flex items-center gap-3 px-3 py-3 rounded-xl bg-purple-50 text-purple-700 font-bold text-sm transition";
                if (drawerBtnLinks) drawerBtnLinks.className = "w-full flex items-center gap-3 px-3 py-3 rounded-xl text-gray-600 hover:bg-gray-50 font-semibold text-sm transition";

                viewDesign.classList.remove('hidden');
                renderThemeGallery();

        function loadData() {
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    profileData = docSnap.data();
                    sections = profileData.sections || [];
                    currentThemeId = profileData.theme || 'aurora';

                    const defaultAvatar = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=128&auto=format&fit=crop";
                    const avatarUrl = profileData.avatar || defaultAvatar;
                    const displayName = profileData.name || "🍀LHAnh🍀";
                    const bioDesc = profileData.desc || "";

                    document.getElementById('admin-avatar').src = avatarUrl;
                    document.getElementById('main-profile-avatar').src = avatarUrl;
                    document.getElementById('preview-avatar').src = avatarUrl;

                    document.getElementById('admin-display-name').innerText = displayName;
                    document.getElementById('main-profile-name').value = displayName;
                    document.getElementById('preview-name').innerText = displayName;

                    document.getElementById('main-profile-desc').value = bioDesc;
                    document.getElementById('preview-desc').innerText = bioDesc;

                    renderThemeGallery();
                    renderSocialsPreview();
                    renderEditor();
                    renderPreview();
                    initSortable();
                }
            });
        }

        function renderThemeGallery() {
            const container = document.getElementById('themes-grid');
            if (!container) return;
            container.innerHTML = '';

            Object.values(THEMES).forEach(th => {
                const isSelected = th.id === currentThemeId;
                container.innerHTML += `
                    <div onclick="selectTheme('${th.id}')" class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-full aspect-[4/5] rounded-3xl ${th.previewBg} p-3 flex flex-col justify-between border-2 transition transform group-hover:scale-105 shadow-sm relative ${isSelected ? 'border-purple-600 ring-4 ring-purple-100' : 'border-transparent'}">
                            <span class="text-xs font-serif font-bold ${th.textColor}">Aa</span>
                            <div class="w-full h-5 rounded-lg bg-white/70 shadow-sm"></div>
                            ${isSelected ? '<span class="absolute top-2 right-2 w-5 h-5 bg-purple-600 text-white rounded-full flex items-center justify-center text-[10px] shadow"><i class="fa-solid fa-check"></i></span>' : ''}
                        </div>
                        <span class="text-xs font-semibold ${isSelected ? 'text-purple-700 font-bold' : 'text-gray-600'}">${th.name}</span>
                    </div>
                `;
            });
        }

        window.selectTheme = async (themeId) => {
            currentThemeId = themeId;
            profileData.theme = themeId;
            renderThemeGallery();
            renderPreview();
            await syncFirebase(false);
        };

        window.changeAvatar = async () => {
            const newUrl = prompt("Nhập liên kết ảnh đại diện mới (URL):", profileData.avatar || "");
            if (newUrl && newUrl.trim()) {
                profileData.avatar = newUrl.trim();
                await syncFirebase(false);
            }
        };

        window.updateProfileName = async (val) => {
            profileData.name = val;
            await syncFirebase(false);
        };

        window.updateProfileDesc = async (val) => {
            profileData.desc = val;
            await syncFirebase(false);
        };

        window.editSocial = async (platform) => {
            if (!profileData.socials) profileData.socials = {};
            const currentVal = profileData.socials[platform] || "";
            const promptMsg = platform === 'email' 
                ? "Nhập địa chỉ Email của bạn:" 
                : `Nhập liên kết / username cho ${platform.toUpperCase()}:`;

            const res = prompt(promptMsg, currentVal);
            if (res !== null) {
                profileData.socials[platform] = res.trim();
                await syncFirebase(false);
            }
        };

        function renderSocialsPreview() {
            const container = document.getElementById('preview-socials');
            container.innerHTML = '';
            const s = profileData.socials || {};

            if (s.instagram) {
                container.innerHTML += `<a href="${s.instagram.startsWith('http') ? s.instagram : 'https://instagram.com/' + s.instagram}" target="_blank" class="w-6 h-6 rounded-full bg-white/20 backdrop-blur text-current flex items-center justify-center text-[10px] shadow-sm"><i class="fa-brands fa-instagram"></i></a>`;
            }
            if (s.tiktok) {
                container.innerHTML += `<a href="${s.tiktok.startsWith('http') ? s.tiktok : 'https://tiktok.com/@' + s.tiktok}" target="_blank" class="w-6 h-6 rounded-full bg-white/20 backdrop-blur text-current flex items-center justify-center text-[10px] shadow-sm"><i class="fa-brands fa-tiktok"></i></a>`;
            }
            if (s.youtube) {
                container.innerHTML += `<a href="${s.youtube.startsWith('http') ? s.youtube : 'https://youtube.com/' + s.youtube}" target="_blank" class="w-6 h-6 rounded-full bg-white/20 backdrop-blur text-current flex items-center justify-center text-[10px] shadow-sm"><i class="fa-brands fa-youtube"></i></a>`;

            const itemIndex = grp.items.findIndex(i => i.id === itemId);
            if (itemIndex > -1) {
                const [targetItem] = grp.items.splice(itemIndex, 1);
                sections.push({
                    id: 'sec_' + Math.random().toString(36).substr(2, 9),
                    type: 'link',
                    item: targetItem
                });

            }

                    const addLinkInlineForm = `
                        <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-sm space-y-3 ${isAddOpen ? '' : 'hidden'}" id="add-link-box-${sec.id}">
                            <div class="flex items-center justify-between pb-1 border-b border-gray-100">
                                <span class="font-bold text-[11px] text-gray-500 uppercase tracking-wider">Thêm vào "${sec.title}"</span>
                                <button onclick="toggleGroupAddForm('${sec.id}')" class="text-gray-400 hover:text-gray-600 text-xs">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <input type="text" id="input-title-${sec.id}" placeholder="Tiêu đề link" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-black">
                            <input type="text" id="input-url-${sec.id}" placeholder="URL" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-black">

                    container.innerHTML += `
                        <div class="section-item-wrapper bg-[#eceef2] rounded-[32px] p-4 space-y-3 transition" data-section-id="${sec.id}" data-section-type="group">

                                    <button onclick="toggleLayoutPanel('${sec.id}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold text-xs text-white shadow-sm transition ${isPanelOpen ? 'bg-purple-700 ring-2 ring-purple-300' : 'bg-[#7c3aed] hover:bg-purple-700'}">

                                        <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>

                            ${layoutSettingsPanel}

                                    <div class="empty-hint text-center py-5 text-gray-400 text-xs">

                                <button onclick="toggleGroupAddForm('${sec.id}')" class="w-full py-2.5 px-4 bg-white hover:bg-gray-50 border border-gray-200 rounded-2xl font-bold text-xs text-neutral-700 shadow-sm transition flex items-center justify-center gap-2">

                    container.innerHTML += `
                        <div class="section-item-wrapper relative" data-section-id="${sec.id}" data-section-type="link">

                // 2. Ô đệm xen kẽ sau từng khối
                container.innerHTML += `
                    <div class="nested-dropzone orphan-slot rounded-2xl flex items-center justify-center text-[11px] text-purple-700 font-medium" data-dropzone-type="orphan-zone">

        window.toggleLayoutPanel = (groupId) => {
            if (openedLayoutPanels.has(groupId)) {
                openedLayoutPanels.delete(groupId);
            } else {
                openedLayoutPanels.add(groupId);
            }
            renderEditor();
            initSortable();
        };

        window.toggleGroupAddForm = (groupId) => {
            if (openedGroupAddForms.has(groupId)) {
                openedGroupAddForms.delete(groupId);
            } else {
                openedGroupAddForms.add(groupId);
            }
            renderEditor();
            initSortable();

            if (openedGroupAddForms.has(groupId)) {
                setTimeout(() => {
                    const inputEl = document.getElementById(`input-title-${groupId}`);
                    if (inputEl) inputEl.focus();
                }, 50);
            }
        };

        window.saveLinkInsideGroup = async (groupId) => {
            const titleEl = document.getElementById(`input-title-${groupId}`);
            const urlEl = document.getElementById(`input-url-${groupId}`);

            const title = titleEl ? titleEl.value.trim() : '';
            const url = urlEl ? urlEl.value.trim() : '';

            if (!title || !url) {
                alert("Vui lòng nhập đầy đủ tiêu đề và URL!");
                return;
            }

            const grp = sections.find(s => s.id === groupId);
            if (grp && grp.items) {
                grp.items.push({
                    id: 'item_' + Math.random().toString(36).substr(2, 9),
                    title,
                    url,
                    active: true,
                    clicks: 0
                });
                openedGroupAddForms.delete(groupId);
                await syncFirebase();
            }
        };

        window.selectGroupLayout = async (groupId, layoutName) => {
            const group = sections.find(s => s.id === groupId);
            if (group) {
                group.layout = layoutName;
                await syncFirebase(false);
                renderEditor();
                renderPreview();
                initSortable();
            }
        };

        function initSortable() {
            const rootEl = document.getElementById('sections-container');
            if (rootSortable) rootSortable.destroy();
            nestedSortables.forEach(s => s.destroy());
            nestedSortables = [];

            // Sortable cấp gốc
            rootSortable = new Sortable(rootEl, {
                handle: '.drag-handle-root',
                draggable: '.section-item-wrapper',
                animation: 200,
                ghostClass: 'sortable-ghost',
                touchStartThreshold: 5,
                delay: 50,
                delayOnTouchOnly: true,
                onEnd: parseCurrentDOMAndSync
            });

            // Sortable cấp con cho các Dropzones
            const dropzones = document.querySelectorAll('.nested-dropzone');
            dropzones.forEach(zone => {
                const s = new Sortable(zone, {
                    group: {
                        name: 'shared-links',
                        pull: true,
                        put: true
                    },
                    handle: '.drag-handle-item',
                    draggable: '.nested-item',
                    animation: 200,
                    fallbackOnBody: true,
                    swapThreshold: 0.65,
                    ghostClass: 'sortable-ghost',
                    touchStartThreshold: 5,
                    delay: 50,
                    delayOnTouchOnly: true,

                    // Bắt đầu nhấc link: Mở các khe nhận link
                    onStart: function () {
                        document.body.classList.add('is-dragging-link');
                    },

                    // Thả link xuống: Thu nhỏ và ẩn các khe lại
                    onEnd: function (evt) {
                        document.body.classList.remove('is-dragging-link');
                        parseCurrentDOMAndSync(evt);
                    }
                });
                nestedSortables.push(s);
            });
        }

        async function parseCurrentDOMAndSync() {
            const newSections = [];
            const itemMap = new Map();

            sections.forEach(s => {
                if (s.type === 'group') {
                    (s.items || []).forEach(it => itemMap.set(it.id, it));
                } else if (s.type === 'link') {
                    itemMap.set(s.item.id, s.item);
                }
            });

            const rootEl = document.getElementById('sections-container');
            const children = rootEl.children;

            for (let el of children) {
                if (el.classList.contains('section-item-wrapper')) {
                    const type = el.getAttribute('data-section-type');
                    const secId = el.getAttribute('data-section-id');

                    if (type === 'group') {
                        const originalGroup = sections.find(s => s.id === secId) || {
                            id: secId,
                            title: 'Nhóm',
                            active: true,
                            layout: 'stack'
                        };

                        const groupItems = [];
                        const itemCards = el.querySelectorAll(':scope > .nested-dropzone > .nested-item');
                        itemCards.forEach(card => {
                            const itId = card.getAttribute('data-item-id');
                            if (itemMap.has(itId)) {
                                groupItems.push(itemMap.get(itId));
                            }
                        });

                        newSections.push({
                            id: originalGroup.id,
                            type: 'group',
                            title: originalGroup.title || 'Nhóm',
                            layout: originalGroup.layout || 'stack',
                            active: originalGroup.active !== false,
                            items: groupItems
                        });
                    } else if (type === 'link') {
                        const card = el.querySelector('.nested-item');
                        if (card) {
                            const itId = card.getAttribute('data-item-id');
                            if (itemMap.has(itId)) {
                                newSections.push({
                                    id: secId || ('sec_' + Math.random().toString(36).substr(2, 9)),
                                    type: 'link',
                                    item: itemMap.get(itId)
                                });
                            }
                        }
                    }
                } else if (el.getAttribute('data-dropzone-type') === 'orphan-zone') {
                    const orphanCards = el.querySelectorAll('.nested-item');
                    orphanCards.forEach(card => {
                        const itId = card.getAttribute('data-item-id');
                        if (itemMap.has(itId)) {
                            newSections.push({
                                id: 'sec_' + Math.random().toString(36).substr(2, 9),
                                type: 'link',
                                item: itemMap.get(itId)
                            });
                        }
                    });
                }
            }

            sections = newSections;
            await syncFirebase(false);
            renderPreview();
            renderEditor();
            initSortable();
        }

        function renderPreview() {
            const container = document.getElementById('preview-sections');
            const phoneScreen = document.getElementById('phone-preview-screen');
            const theme = THEMES[currentThemeId] || THEMES.aurora;

            phoneScreen.className = `w-full h-full rounded-[34px] overflow-y-auto p-4 flex flex-col items-center pt-8 relative no-scrollbar transition duration-300 ${theme.bodyBg} ${theme.textColor}`;
            container.innerHTML = '';

            sections.forEach(sec => {
                if (sec.type === 'group' && sec.active !== false) {
                    const activeItems = (sec.items || []).filter(item => item.active !== false);
                    if (activeItems.length === 0) return;

                    const layout = sec.layout || 'stack';
                    let itemsContent = '';

                    if (layout === 'grid') {
                        itemsContent = `
                            <div class="grid grid-cols-2 gap-2">
                                ${activeItems.map(link => `
                                    <div class="p-3 rounded-2xl shadow-sm flex flex-col items-center text-center justify-center min-h-[64px] ${theme.linkCard}">
                                        <span class="font-bold text-[11px] truncate w-full ${theme.cardText}">${link.title}</span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    } else if (layout === 'carousel') {
                        itemsContent = `
                            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                                ${activeItems.map(link => `
                                    <div class="flex-shrink-0 w-36 py-3 px-3 rounded-2xl shadow-sm text-center font-bold text-[11px] truncate ${theme.linkCard}">
                                        <span class="truncate block ${theme.cardText}">${link.title}</span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    } else if (layout === 'showcase') {
                        itemsContent = `
                            <div class="space-y-2">
                                ${activeItems.map(link => `
                                    <div class="p-4 rounded-2xl shadow-sm flex items-center justify-between border ${theme.linkCard}">
                                        <div class="truncate pr-2">
                                            <div class="font-extrabold text-xs truncate ${theme.cardText}">${link.title}</div>
                                            <div class="text-[9px] opacity-75 truncate">${link.url}</div>
                                        </div>
                                        <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-75"></i>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    } else {
                        itemsContent = `
                            <div class="space-y-2">
                                ${activeItems.map(link => `
                                    <div class="w-full py-2.5 px-3 rounded-xl shadow-sm flex items-center justify-between text-xs font-semibold ${theme.linkCard}">
                                        <span class="flex-1 text-center truncate pl-4 ${theme.cardText}">${link.title}</span>
                                        <span class="opacity-50 text-xs">&#8942;</span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <div class="w-full space-y-2">
                            <div class="text-[11px] font-bold text-center tracking-wide uppercase ${theme.groupHeader}">${sec.title}</div>
                            ${itemsContent}
                        </div>
                    `;
                } else if (sec.type === 'link' && sec.item && sec.item.active !== false) {
                    container.innerHTML += `
                        <div class="w-full py-2.5 px-3 rounded-xl shadow-sm flex items-center justify-between text-xs font-semibold ${theme.linkCard}">
                            <span class="flex-1 text-center truncate pl-4 ${theme.cardText}">${sec.item.title}</span>
                            <span class="opacity-50 text-xs">&#8942;</span>
                        </div>
                    `;
                }
            });
        }

        window.toggleAddForm = (type) => {
            currentAddType = type;
            const form = document.getElementById('add-form');
            const titleEl = document.getElementById('form-type-title');
            const fieldsEl = document.getElementById('form-fields');

            if (type === 'group') {
                titleEl.innerText = "Tạo Nhóm / Layout Mới";
                fieldsEl.innerHTML = `
                    <input type="text" id="new-group-name" placeholder="Tên nhóm (VD: Mạng xã hội, Tài liệu...)" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-black">
                `;
            } else {
                titleEl.innerText = "Thêm Liên Kết Độc Lập Bên Ngoài";
                fieldsEl.innerHTML = `
                    <input type="text" id="new-item-title" placeholder="Tiêu đề link" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-black">
                    <input type="text" id="new-item-url" placeholder="URL liên kết" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-black">
                `;
            }
            form.classList.remove('hidden');
        };

        window.submitNewItem = async () => {
            if (currentAddType === 'group') {
                const title = document.getElementById('new-group-name').value.trim();
                if (title) {
                    sections.push({
                        id: 'grp_' + Math.random().toString(36).substr(2, 9),
                        type: 'group',
                        title,
                        layout: 'stack',
                        active: true,
                        items: []
                    });
                }
            } else {
                const title = document.getElementById('new-item-title').value.trim();
                const url = document.getElementById('new-item-url').value.trim();
                if (title && url) {
                    sections.push({
                        id: 'sec_' + Math.random().toString(36).substr(2, 9),
                        type: 'link',
                        item: {
                            id: 'item_' + Math.random().toString(36).substr(2, 9),
                            title,
                            url,
                            active: true,
                            clicks: 0
                        }
                    });
                }
            }
            document.getElementById('add-form').classList.add('hidden');
            await syncFirebase();
        };

        window.updateGroupTitle = async (grpId, val) => {
            const g = sections.find(s => s.id === grpId);
            if (g) { g.title = val; await syncFirebase(false); renderPreview(); }
        };

        window.toggleGroupActive = async (grpId) => {
            const g = sections.find(s => s.id === grpId);
            if (g) { g.active = !(g.active !== false); await syncFirebase(false); renderPreview(); }
        };

        window.deleteSection = async (secId) => {
            if (!confirm("Bạn có chắc muốn xóa Layout này?")) return;
            sections = sections.filter(s => s.id !== secId);
            openedLayoutPanels.delete(secId);
            openedGroupAddForms.delete(secId);
            await syncFirebase();
        };

        window.updateItemTitle = async (itemId, val) => {
            findAndApplyItem(itemId, item => item.title = val);
            await syncFirebase(false);
            renderPreview();
        };

        window.updateItemUrl = async (itemId, val) => {
            findAndApplyItem(itemId, item => item.url = val);
            await syncFirebase(false);
            renderPreview();
        };

        window.toggleItemActive = async (itemId) => {
            findAndApplyItem(itemId, item => item.active = !(item.active !== false));
            await syncFirebase(false);
            renderPreview();
        };

        window.deleteItem = async (itemId) => {
            sections.forEach(s => {
                if (s.type === 'group' && s.items) {
                    s.items = s.items.filter(it => it.id !== itemId);
                }
            });
            sections = sections.filter(s => !(s.type === 'link' && s.item.id === itemId));
            await syncFirebase();
        };

        function findAndApplyItem(itemId, callback) {
            sections.forEach(s => {
                if (s.type === 'group' && s.items) {
                    const it = s.items.find(i => i.id === itemId);
                    if (it) callback(it);
                } else if (s.type === 'link' && s.item.id === itemId) {
                    callback(s.item);
                }
            });
        }

        async function syncFirebase(reRender = true) {
            profileData.sections = sections;
            profileData.theme = currentThemeId;
            await setDoc(docRef, profileData);
            if (reRender) {
                renderEditor();
                renderPreview();
                initSortable();
            }
        }
    </script>
</body>

</html>
