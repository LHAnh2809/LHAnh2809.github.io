<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Dashboard - Theme & Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .sortable-ghost {
            opacity: 0.35;
            background: #e0e7ff !important;
            border: 2px dashed #6366f1 !important;
        }

        .drag-handle-group,
        .drag-handle-item {
            cursor: grab;
        }

        .drag-handle-group:active,
        .drag-handle-item:active {
            cursor: grabbing;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .nested-dropzone {
            min-height: 56px !important;
        }

        .empty-hint {
            pointer-events: none !important;
            user-select: none !important;
        }
    </style>
</head>

<body class="bg-[#f6f7f9] font-sans h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- TOPNAV -->
    <header class="h-14 bg-white border-b border-gray-200 px-6 flex justify-between items-center flex-shrink-0 z-10">
        <div class="flex items-center gap-3">
            <i class="fa-brands fa-pagelines text-2xl text-green-600"></i>
            <span class="font-bold text-sm tracking-tight">Bio Dashboard</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-xs bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full font-semibold">
                <i class="fa-solid fa-bolt mr-1"></i> Pro Plan
            </div>
            <button onclick="handleLogout()" id="btn-logout"
                class="hidden text-xs text-red-500 font-medium hover:underline">Đăng xuất</button>
        </div>
    </header>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen"
        class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <div
                class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-bold mb-1">Đăng nhập Admin</h2>
            <p class="text-xs text-gray-400 mb-6">Quản lý giao diện Bio của bạn</p>
            <input type="email" id="login-email" placeholder="Email Admin"
                class="w-full p-3 mb-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-purple-600">
            <input type="password" id="login-pass" placeholder="Mật khẩu"
                class="w-full p-3 mb-4 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-purple-600">
            <button onclick="handleLogin()"
                class="w-full bg-[#8a2be2] hover:bg-purple-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg transition">Đăng
                Nhập</button>
        </div>
    </div>

    <!-- KHỐI QUẢN LÝ -->
    <div class="flex-1 flex overflow-hidden">

        <!-- SIDEBAR TRÁI -->
        <aside
            class="w-60 bg-white border-r border-gray-200 p-4 flex flex-col justify-between hidden md:flex flex-shrink-0">
            <div class="space-y-6">
                <div class="flex items-center gap-3 p-2 bg-gray-50 rounded-xl">
                    <img id="admin-avatar"
                        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=128&auto=format&fit=crop"
                        class="w-10 h-10 rounded-full object-cover">
                    <div class="truncate">
                        <h4 id="admin-display-name" class="font-bold text-xs truncate">LHAnh</h4>
                        <span class="text-[10px] text-gray-400">linktr.ee/lhanh</span>
                    </div>
                </div>

                <!-- MENU TABS CHUYỂN LINKS VÀ DESIGN -->
                <nav class="space-y-1">
                    <button onclick="switchTab('links')" id="tab-btn-links"
                        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-purple-50 text-purple-700 font-semibold text-xs transition">
                        <i class="fa-solid fa-list text-[#8a2be2]"></i> Links
                    </button>
                    <button onclick="switchTab('design')" id="tab-btn-design"
                        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 hover:bg-gray-50 font-medium text-xs transition">
                        <i class="fa-solid fa-palette"></i> Design (Themes)
                    </button>
                    <a href="#"
                        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 hover:bg-gray-50 font-medium text-xs">
                        <i class="fa-solid fa-chart-line"></i> Analytics
                    </a>
                </nav>
            </div>
        </aside>

        <!-- PANEL NỘI DUNG Ở GIỮA -->
        <main class="flex-1 overflow-y-auto p-6 md:p-8">
            <div class="max-w-xl mx-auto space-y-6">

                <!-- 1. TAB LINKS (Quản lý Link & Layout) -->
                <div id="view-links" class="space-y-6">
                    <!-- PROFILE HEADER -->
                    <div
                        class="flex items-center gap-5 px-2 py-3 bg-white rounded-3xl p-4 border border-gray-200/70 shadow-sm">
                        <div class="relative group cursor-pointer" onclick="changeAvatar()">
                            <img id="main-profile-avatar"
                                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=128&auto=format&fit=crop"
                                class="w-16 h-16 rounded-full object-cover shadow border border-gray-200">
                            <div
                                class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-white text-xs font-semibold">
                                <i class="fa-solid fa-camera"></i>
                            </div>
                        </div>

                        <div class="flex-1 space-y-1">
                            <input type="text" id="main-profile-name" onchange="updateProfileName(this.value)"
                                value="🍀LHAnh🍀"
                                class="font-bold text-base text-neutral-900 border-b border-transparent hover:border-gray-300 focus:border-black focus:outline-none bg-transparent w-full">
                            <input type="text" id="main-profile-desc" onchange="updateProfileDesc(this.value)"
                                placeholder="Add bio" value=""
                                class="text-xs text-gray-400 font-medium border-b border-transparent hover:border-gray-300 focus:border-black focus:outline-none bg-transparent w-full placeholder-gray-400">

                            <!-- Social Icons -->
                            <div class="flex items-center gap-2 pt-1" id="social-icons-bar">
                                <div class="relative group cursor-pointer" onclick="editSocial('instagram')">
                                    <div
                                        class="w-6 h-6 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-600 hover:text-pink-600 shadow-sm text-[10px]">
                                        <i class="fa-brands fa-instagram"></i></div>
                                </div>
                                <div class="relative group cursor-pointer" onclick="editSocial('tiktok')">
                                    <div
                                        class="w-6 h-6 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-600 hover:text-black shadow-sm text-[10px]">
                                        <i class="fa-brands fa-tiktok"></i></div>
                                </div>
                                <div class="relative group cursor-pointer" onclick="editSocial('youtube')">
                                    <div
                                        class="w-6 h-6 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-600 hover:text-red-600 shadow-sm text-[10px]">
                                        <i class="fa-brands fa-youtube"></i></div>
                                </div>
                                <div class="relative group cursor-pointer" onclick="editSocial('email')">
                                    <div
                                        class="w-6 h-6 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-600 hover:text-indigo-600 shadow-sm text-[10px]">
                                        <i class="fa-regular fa-envelope"></i></div>
                                </div>
                                <button onclick="editSocial('custom')"
                                    class="w-6 h-6 rounded-full bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-gray-600 text-[10px] shadow-sm transition"><i
                                        class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                    </div>

                    <!-- Nút thao tác -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="toggleAddForm('link')"
                            class="bg-black hover:bg-neutral-800 text-white font-semibold py-3 px-4 rounded-full shadow-md transition flex items-center justify-center gap-2 text-xs">
                            <i class="fa-solid fa-plus"></i> Thêm Link Ngoài
                        </button>
                        <button onclick="toggleAddForm('group')"
                            class="bg-white border border-gray-300 hover:bg-gray-50 text-neutral-800 font-semibold py-3 px-4 rounded-full shadow-sm transition flex items-center justify-center gap-2 text-xs">
                            <i class="fa-solid fa-layer-group"></i> Thêm Nhóm (Layout)
                        </button>
                    </div>

                    <!-- Form thêm ngoài -->
                    <div id="add-form"
                        class="bg-white p-5 rounded-3xl border border-gray-200 shadow-sm space-y-3 hidden">
                        <h4 id="form-type-title" class="font-bold text-xs text-gray-500 uppercase tracking-wider">Thêm
                            mới</h4>
                        <div id="form-fields" class="space-y-3"></div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="submitNewItem()"
                                class="flex-1 bg-black hover:bg-neutral-800 text-white py-2.5 rounded-xl text-xs font-bold">Xác
                                nhận</button>
                            <button onclick="document.getElementById('add-form').classList.add('hidden')"
                                class="px-4 bg-gray-100 text-gray-600 py-2.5 rounded-xl text-xs font-semibold">Hủy</button>
                        </div>
                    </div>

                    <!-- Danh sách mục Linktree -->
                    <div id="sections-container" class="space-y-5"></div>
                </div>

                <!-- 2. TAB DESIGN / THEMES (Khớp giao diện như ảnh mẫu) -->
                <div id="view-design" class="space-y-6 hidden">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-extrabold text-neutral-900 tracking-tight">Themes</h2>
                            <p class="text-xs text-gray-500 mt-0.5">Chọn phong cách và màu sắc cho trang Bio của bạn</p>
                        </div>
                        <span
                            class="text-xs font-semibold px-3 py-1 bg-purple-100 text-purple-700 rounded-full">Customizable</span>
                    </div>

                    <!-- Grid Thư Viện Theme -->
                    <div class="grid grid-cols-3 sm:grid-cols-4 gap-4" id="themes-grid"></div>
                </div>

            </div>
        </main>

        <!-- RIGHT MOBILE PREVIEW (Tự động thay đổi phong cách theo theme đã chọn) -->
        <aside
            class="w-[380px] bg-white border-l border-gray-200 flex flex-col items-center justify-center p-6 hidden lg:flex flex-shrink-0">
            <div
                class="w-[280px] h-[560px] bg-slate-900 rounded-[40px] p-3 shadow-2xl border-4 border-slate-800 relative flex flex-col">
                <div class="w-24 h-4 bg-slate-800 rounded-b-xl mx-auto absolute top-3 left-1/2 -translate-x-1/2 z-20">
                </div>

                <!-- Khung điện thoại áp dụng Theme -->
                <div id="phone-preview-screen"
                    class="w-full h-full rounded-[30px] overflow-y-auto p-4 flex flex-col items-center pt-8 relative no-scrollbar transition duration-300">
                    <img id="preview-avatar"
                        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=128&auto=format&fit=crop"
                        class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-md mb-2">
                    <h3 id="preview-name" class="font-bold text-sm text-center">🍀LHAnh🍀</h3>
                    <p id="preview-desc" class="text-[10px] opacity-75 text-center mb-2"></p>

                    <div id="preview-socials" class="flex items-center justify-center gap-2 mb-4 empty:hidden"></div>
                    <div id="preview-sections" class="w-full space-y-4"></div>
                </div>
            </div>
        </aside>

    </div>

    <!-- SCRIPT & FIREBASE ENGINE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXvqlnqB9u0QoZAX6rmFBngHRmAlnjWYs",
            authDomain: "shops-976ea.firebaseapp.com",
            projectId: "shops-976ea",
            storageBucket: "shops-976ea.firebasestorage.app",
            messagingSenderId: "880320435925",
            appId: "1:880320435925:web:df55e51bc74d45c75ff45c",
            measurementId: "G-TVQR4E2F9K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const docRef = doc(db, "bio", "profile");

        // ĐỊNH NGHĨA CÁC THEME LINKTREE
        const THEMES = {
            // 1. Cực quang huyền bí (Aurora Glow)
            aurora: {
                id: 'aurora',
                name: 'Aurora',
                previewBg: 'bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-teal-400 via-indigo-900 to-slate-950',
                bodyBg: 'bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-teal-400 via-indigo-900 to-slate-950 text-emerald-100',
                textColor: 'text-emerald-100',
                groupHeader: 'text-teal-300 font-semibold tracking-wider drop-shadow',
                linkCard: 'bg-emerald-950/30 backdrop-blur-xl border border-teal-400/30 hover:border-teal-300 hover:bg-emerald-900/40 shadow-[0_8px_30px_rgb(0,0,0,0.3)] transition duration-300',
                cardText: 'text-teal-50 font-medium'
            },

            // 2. Hoàng hôn thơ mộng (Sunset Aura)
            sunset: {
                id: 'sunset',
                name: 'Sunset Aura',
                previewBg: 'bg-gradient-to-tr from-amber-500 via-rose-600 to-indigo-900',
                bodyBg: 'bg-gradient-to-tr from-amber-500 via-rose-600 to-indigo-900 text-white',
                textColor: 'text-white',
                groupHeader: 'text-amber-200 font-bold tracking-widest drop-shadow-sm',
                linkCard: 'bg-white/15 backdrop-blur-lg border border-white/30 hover:bg-white/25 shadow-lg shadow-rose-950/20 transition duration-300',
                cardText: 'text-white font-semibold'
            },

            // 3. Kính tối thượng hạng (Obsidian Glass)
            obsidian: {
                id: 'obsidian',
                name: 'Obsidian',
                previewBg: 'bg-[#0b0f19]',
                bodyBg: 'bg-[#0b0f19] text-neutral-200',
                textColor: 'text-neutral-200',
                groupHeader: 'text-neutral-400 font-bold uppercase tracking-widest',
                linkCard: 'bg-neutral-900/70 backdrop-blur-md border border-neutral-800 hover:border-neutral-600 hover:bg-neutral-800/80 shadow-2xl transition duration-300',
                cardText: 'text-neutral-100 font-medium'
            },

            // 4. Cyberpunk Neon tương lai
            cyberpunk: {
                id: 'cyberpunk',
                name: 'Cyberpunk',
                previewBg: 'bg-[#090014]',
                bodyBg: 'bg-[#090014] text-cyan-300',
                textColor: 'text-cyan-300',
                groupHeader: 'text-fuchsia-400 font-black tracking-widest drop-shadow-[0_0_8px_rgba(232,121,249,0.8)]',
                linkCard: 'bg-black/60 backdrop-blur-md border-2 border-cyan-400/80 hover:border-fuchsia-400 hover:shadow-[0_0_20px_rgba(34,211,238,0.6)] shadow-[0_0_10px_rgba(34,211,238,0.3)] transition duration-300',
                cardText: 'text-cyan-200 font-bold tracking-wide'
            },

            // 5. Trà xanh đất nung tối giản (Matcha Clay)
            matcha: {
                id: 'matcha',
                name: 'Matcha Clay',
                previewBg: 'bg-gradient-to-b from-[#e8ece5] to-[#d3decb]',
                bodyBg: 'bg-gradient-to-b from-[#e8ece5] to-[#d3decb] text-[#2c3e2d]',
                textColor: 'text-[#2c3e2d]',
                groupHeader: 'text-[#3e563f] font-bold tracking-wide',
                linkCard: 'bg-white/80 backdrop-blur border border-[#b8c9b0] text-[#2c3e2d] hover:bg-white shadow-sm hover:shadow-md transition duration-300',
                cardText: 'text-[#2c3e2d] font-semibold'
            },

            // 6. Mây tím pastel ngọt ngào (Lilac Dream)
            lilac: {
                id: 'lilac',
                name: 'Lilac Dream',
                previewBg: 'bg-gradient-to-br from-indigo-200 via-purple-100 to-pink-200',
                bodyBg: 'bg-gradient-to-br from-indigo-200 via-purple-100 to-pink-200 text-indigo-950',
                textColor: 'text-indigo-950',
                groupHeader: 'text-purple-800 font-bold',
                linkCard: 'bg-white/70 backdrop-blur-md border border-purple-200/60 text-indigo-950 hover:bg-white shadow-[0_4px_20px_rgba(168,85,247,0.1)] transition duration-300',
                cardText: 'text-indigo-950 font-semibold'
            },

            // 7. Đại dương sâu thẳm (Deep Ocean)
            ocean: {
                id: 'ocean',
                name: 'Deep Ocean',
                previewBg: 'bg-gradient-to-b from-blue-950 via-slate-900 to-black',
                bodyBg: 'bg-gradient-to-b from-blue-950 via-slate-900 to-black text-sky-200',
                textColor: 'text-sky-200',
                groupHeader: 'text-sky-400 font-semibold tracking-wider',
                linkCard: 'bg-blue-900/20 backdrop-blur-xl border border-sky-400/20 hover:border-sky-400/60 hover:bg-blue-900/40 shadow-lg transition duration-300',
                cardText: 'text-sky-100 font-medium'
            },

            // 8. Đen trắng Neo-Brutalism phá cách
            neo: {
                id: 'neo',
                name: 'Neo Brutal',
                previewBg: 'bg-[#fffdf0]',
                bodyBg: 'bg-[#fffdf0] text-black',
                textColor: 'text-black',
                groupHeader: 'text-black font-black uppercase tracking-wider',
                linkCard: 'bg-white text-black border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all font-black',
                cardText: 'text-black font-black'
            }
        };

        let profileData = {};
        let sections = [];
        let currentThemeId = 'air';
        let openedLayoutPanels = new Set();
        let openedGroupAddForms = new Set();
        let rootSortable = null;
        let nestedSortables = [];
        let currentAddType = 'link';

        const LAYOUT_DESCRIPTIONS = {
            stack: 'Display links in a compact list.',
            grid: 'Display links side by side in two columns.',
            carousel: 'Display links horizontally in a swipeable slider.',
            showcase: 'Feature links prominently with enlarged showcase preview.'
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('btn-logout').classList.add('hidden');
            }
        });

        window.handleLogin = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                alert("Email hoặc Mật khẩu không chính xác!");
            }
        };

        window.handleLogout = () => signOut(auth);

        // Chuyển đổi Tab Links / Design
        window.switchTab = (tab) => {
            const btnLinks = document.getElementById('tab-btn-links');
            const btnDesign = document.getElementById('tab-btn-design');
            const viewLinks = document.getElementById('view-links');
            const viewDesign = document.getElementById('view-design');

            if (tab === 'links') {
                btnLinks.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-purple-50 text-purple-700 font-semibold text-xs transition";
                btnDesign.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 hover:bg-gray-50 font-medium text-xs transition";
                viewLinks.classList.remove('hidden');
                viewDesign.classList.add('hidden');
            } else {
                btnDesign.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-purple-50 text-purple-700 font-semibold text-xs transition";
                btnLinks.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 hover:bg-gray-50 font-medium text-xs transition";
                viewLinks.classList.add('hidden');
                viewDesign.classList.remove('hidden');
                renderThemeGallery();
            }
        };

        function loadData() {
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    profileData = docSnap.data();
                    sections = profileData.sections || [];
                    currentThemeId = profileData.theme || 'air';

                    const defaultAvatar = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=128&auto=format&fit=crop";
                    const avatarUrl = profileData.avatar || defaultAvatar;
                    const displayName = profileData.name || "🍀LHAnh🍀";
                    const bioDesc = profileData.desc || "";

                    document.getElementById('admin-avatar').src = avatarUrl;
                    document.getElementById('main-profile-avatar').src = avatarUrl;
                    document.getElementById('preview-avatar').src = avatarUrl;

                    document.getElementById('admin-display-name').innerText = displayName;
                    document.getElementById('main-profile-name').value = displayName;
                    document.getElementById('preview-name').innerText = displayName;

                    document.getElementById('main-profile-desc').value = bioDesc;
                    document.getElementById('preview-desc').innerText = bioDesc;

                    renderThemeGallery();
                    renderSocialsPreview();
                    renderEditor();
                    renderPreview();
                    initSortable();
                }
            });
        }

        // Render kho Theme (Design Tab)
        function renderThemeGallery() {
            const container = document.getElementById('themes-grid');
            if (!container) return;
            container.innerHTML = '';

            Object.values(THEMES).forEach(th => {
                const isSelected = th.id === currentThemeId;
                container.innerHTML += `
                    <div onclick="selectTheme('${th.id}')" class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-full aspect-[4/5] rounded-3xl ${th.previewBg} p-3 flex flex-col justify-between border-2 transition transform group-hover:scale-105 shadow-sm relative ${isSelected ? 'border-purple-600 ring-4 ring-purple-100' : 'border-transparent'}">
                            <span class="text-xs font-serif font-bold ${th.textColor}">Aa</span>
                            <div class="w-full h-5 rounded-lg bg-white/70 shadow-sm"></div>

            const url = urlEl ? urlEl.value.trim() : '';

            if (!title || !url) {

                return;

            if (grp && grp.items) {

                    clicks: 0

                renderEditor();

        function initSortable() {
            const rootEl = document.getElementById('sections-container');
            if (rootSortable) rootSortable.destroy();
            nestedSortables.forEach(s => s.destroy());
            nestedSortables = [];

            rootSortable = new Sortable(rootEl, {
                handle: '.drag-handle-group',
                draggable: '.section-group-box',
                animation: 180,
                ghostClass: 'sortable-ghost',
                onEnd: parseCurrentDOMAndSync
            });

            const dropzones = document.querySelectorAll('.nested-dropzone');
            dropzones.forEach(zone => {
                const s = new Sortable(zone, {
                    group: { name: 'shared-links', pull: true, put: true },
                    handle: '.drag-handle-item',
                    draggable: '.nested-item',
                    animation: 180,
                    fallbackOnBody: true,
                    swapThreshold: 0.65,
                    ghostClass: 'sortable-ghost',
                    onEnd: parseCurrentDOMAndSync
                });
                nestedSortables.push(s);
            });
        }

        async function parseCurrentDOMAndSync() {
            const newSections = [];
            const itemMap = new Map();

            sections.forEach(s => {
                if (s.type === 'group') {
                    (s.items || []).forEach(it => itemMap.set(it.id, it));
                } else if (s.type === 'link') {
                    itemMap.set(s.item.id, s.item);
                }
            });

            const wrappers = document.getElementById('sections-container').children;
            for (let wrap of wrappers) {
                const type = wrap.getAttribute('data-section-type');
                const secId = wrap.getAttribute('data-section-id');

                if (type === 'group') {
                    const originalGroup = sections.find(s => s.id === secId) || { id: secId, title: 'Nhóm', active: true, layout: 'stack' };
                    const groupItems = [];
                    const itemCards = wrap.querySelectorAll('.nested-dropzone .nested-item');
                    itemCards.forEach(card => {
                        const itId = card.getAttribute('data-item-id');
                        if (itemMap.has(itId)) {
                            groupItems.push(itemMap.get(itId));
                        }
                    });

                    newSections.push({
                        id: originalGroup.id,
                        type: 'group',
                        title: originalGroup.title || 'Nhóm',
                        layout: originalGroup.layout || 'stack',
                        active: originalGroup.active !== false,
                        items: groupItems
                    });
                } else if (type === 'link') {
                    const itemCards = wrap.querySelectorAll('.nested-dropzone .nested-item');
                    itemCards.forEach(card => {
                        const itId = card.getAttribute('data-item-id');
                        if (itemMap.has(itId)) {
                            newSections.push({
                                id: 'sec_' + Math.random().toString(36).substr(2, 9),
                                type: 'link',
                                item: itemMap.get(itId)
                            });
                        }
                    });
                }
            }

            sections = newSections;
            await syncFirebase(false);
            renderPreview();
        }

                titleEl.innerText = "Tạo Nhóm / Layout Mới";
                fieldsEl.innerHTML = `
                    <input type="text" id="new-group-name" placeholder="Tên nhóm" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-black">
                `;
            } else {
                titleEl.innerText = "Thêm Liên Kết Độc Lập Bên Ngoài";
                fieldsEl.innerHTML = `
                    <input type="text" id="new-item-title" placeholder="Tiêu đề link (VD: 3105 - Cr: YangJi)" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-black">
                    <input type="text" id="new-item-url" placeholder="URL" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-black">
                `;
            }
            form.classList.remove('hidden');
        };

        window.submitNewItem = async () => {
            if (currentAddType === 'group') {
                const title = document.getElementById('new-group-name').value.trim();
                if (title) {
                    sections.push({
                        id: 'grp_' + Math.random().toString(36).substr(2, 9),
                        type: 'group',
                        title,
                        layout: 'stack',
                        active: true,
                        items: []
                    });
                }
            } else {
                const title = document.getElementById('new-item-title').value.trim();
                const url = document.getElementById('new-item-url').value.trim();
                if (title && url) {
                    sections.push({
                        id: 'sec_' + Math.random().toString(36).substr(2, 9),
                        type: 'link',
                        item: {
                            id: 'item_' + Math.random().toString(36).substr(2, 9),
                            title,
                            url,
                            active: true,
                            clicks: 0
                        }
                    });
                }
            }
            document.getElementById('add-form').classList.add('hidden');
            await syncFirebase();
        };

        window.updateGroupTitle = async (grpId, val) => {
            const g = sections.find(s => s.id === grpId);
            if (g) { g.title = val; await syncFirebase(false); renderPreview(); }
        };

        window.toggleGroupActive = async (grpId) => {
            const g = sections.find(s => s.id === grpId);
            if (g) { g.active = !(g.active !== false); await syncFirebase(false); renderPreview(); }
        };

        window.deleteSection = async (secId) => {
            if (!confirm("Bạn có chắc muốn xóa layout này?")) return;
            sections = sections.filter(s => s.id !== secId);
            openedLayoutPanels.delete(secId);
            openedGroupAddForms.delete(secId);
            await syncFirebase();
        };

        window.updateItemTitle = async (itemId, val) => {
            findAndApplyItem(itemId, item => item.title = val);
            await syncFirebase(false);
            renderPreview();
        };

        window.updateItemUrl = async (itemId, val) => {
            findAndApplyItem(itemId, item => item.url = val);
            await syncFirebase(false);
            renderPreview();
        };

        window.toggleItemActive = async (itemId) => {
            findAndApplyItem(itemId, item => item.active = !(item.active !== false));
            await syncFirebase(false);
            renderPreview();
        };

        window.deleteItem = async (itemId) => {
            sections.forEach(s => {
                if (s.type === 'group' && s.items) {
                    s.items = s.items.filter(it => it.id !== itemId);
                }
            });
            sections = sections.filter(s => !(s.type === 'link' && s.item.id === itemId));
            await syncFirebase();
        };

        function findAndApplyItem(itemId, callback) {
            sections.forEach(s => {
                if (s.type === 'group' && s.items) {
                    const it = s.items.find(i => i.id === itemId);
                    if (it) callback(it);
                } else if (s.type === 'link' && s.item.id === itemId) {
                    callback(s.item);
                }
            });
        }

        async function syncFirebase(reRender = true) {
            profileData.sections = sections;
            profileData.theme = currentThemeId;
            await setDoc(docRef, profileData);
            if (reRender) {
                renderEditor();
                renderPreview();
                initSortable();
            }
        }
    </script>
</body>

</html>
